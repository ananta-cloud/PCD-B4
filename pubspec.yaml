name: smart_receipt_scanner
description: "Smart Receipt Scanner - AI-powered OCR receipt scanning app"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.5.0
  google_mlkit_text_recognition: ^0.14.0
  path_provider: ^2.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_dotenv: ^6.0.1
  mongo_dart: ^0.10.8
  bcrypt: ^1.2.0
  pdf: ^3.12.0
  printing: ^5.14.3
  intl: ^0.20.2
  # opencv_dart: 2.2.1+4  # Temporarily disabled - requires native NDK build

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/models/datasets/images/
    - .env
